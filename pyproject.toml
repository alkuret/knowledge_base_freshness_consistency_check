[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alkuret-knowledge_base_freshness_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测预训练数据工程师·知识库的时效性维护相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alkuret" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alkuret.github.io"
Repository = "https://github.com/alkuret/knowledge_base_freshness_consistency_check"
Issues = "https://github.com/alkuret/knowledge_base_freshness_consistency_check/issues"

[project.scripts]
knowledge_base_freshness_consistency_check = "knowledge_base_freshness_consistency_check:main"

[tool.setuptools]
py-modules = ["knowledge_base_freshness_consistency_check"]
